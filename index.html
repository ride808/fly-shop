<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fly Shop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Chase's Fly Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: one phone-width column, big tap targets, bottom tab bar. Money lives in three jars. */
:root{
  --bg:#e9eeec; --card:#ffffff; --ink:#18302b; --muted:#5d716b; --line:#cfdad6;
  --pine:#1f3d36; --pine-ink:#ffffff; --accent:#ff6a1a; --accent-ink:#ffffff;
  --good:#1f7a4d; --warn:#b3261e; --warn-bg:#fbe7e4; --good-bg:#e0f2e8;
  --display:'Bitter',Georgia,serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b18; --card:#182a26; --ink:#e8f0ed; --muted:#9bb0aa; --line:#2b423c;
  --pine:#0b1512; --pine-ink:#e8f0ed; --accent:#ff7d36; --accent-ink:#1a0c02;
  --good:#6fd6a0; --warn:#ff8f86; --warn-bg:#3a1f1c; --good-bg:#17382b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1b18; --card:#182a26; --ink:#e8f0ed; --muted:#9bb0aa; --line:#2b423c;
  --pine:#0b1512; --pine-ink:#e8f0ed; --accent:#ff7d36; --accent-ink:#1a0c02;
  --good:#6fd6a0; --warn:#ff8f86; --warn-bg:#3a1f1c; --good-bg:#17382b; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--pine);color:var(--pine-ink);padding:calc(14px + env(safe-area-inset-top)) 18px 16px}
header h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:.2px}
header p{margin:2px 0 0;opacity:.8;font-size:15px}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:20px;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:15px}
.big{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.jar .big{font-size:23px;display:block;margin-top:4px}
.jar small{display:block;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.jar.restock{border-top:5px solid var(--accent)}
.jar.save{border-top:5px solid var(--good)}
.jar.spend{border-top:5px solid #3b7ea1}
.jar.owe .big{color:var(--warn)}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 16px;min-height:48px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.small{min-height:40px;padding:8px 14px;font-size:15px}
button.wide{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-weight:800;font-size:15px;margin-bottom:4px}
.pill{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.pill.open{background:var(--accent);color:var(--accent-ink)}
.pill.tied{background:#3b7ea1;color:#fff}
.pill.paid{background:var(--good);color:#fff}
.pill.bad{background:var(--warn);color:#fff}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar.low i{background:var(--warn)}
.btnlink{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;text-decoration:none;padding:10px 16px}
.sheet details{background:var(--card);border-radius:12px;padding:12px 14px}
.sheet summary{font-weight:800;cursor:pointer;min-height:24px}
.steps{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:8px}
.steps li{padding:10px 12px;background:var(--card);border-radius:12px;cursor:pointer;list-style-position:outside}
.steps li.done{text-decoration:line-through;opacity:.55}
.swipe{background:var(--warn);border-radius:12px;overflow:hidden}
.swipe .recipe-line{background:var(--card);padding:6px 8px;border-radius:12px;touch-action:pan-y}
.arow{padding:4px 2px}
.fphoto{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:block}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
.okmsg{background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:transparent;color:var(--muted);border-radius:0;padding:10px 4px;min-height:62px;font-size:12px;line-height:1.1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:26px;height:26px}
nav button[aria-current="page"]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet>*{flex-shrink:0}
.sheet h3{font-family:var(--display);margin:0;font-size:21px}
.recipe-line{display:flex;gap:10px;align-items:center}
.recipe-line .nm{flex:1;font-size:15px}
.recipe-line input{width:78px;min-height:40px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:800}
.chips{min-height:48px;display:flex;gap:8px;overflow-x:auto;padding:3px}
.chip{flex:none;white-space:nowrap;min-height:40px;padding:6px 14px;font-size:15px;border-radius:99px;background:transparent;color:var(--ink);border:2px solid transparent}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--ink);font-weight:800;box-shadow:0 0 0 2px var(--accent)}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
textarea{font:13px/1.3 ui-monospace,monospace;width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);padding:10px;background:var(--card);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){button{transition:transform .08s}button:active{transform:scale(.97)}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Chase's Fly Shop</h1><p id="tag">Tie it. Sell it. Restock.</p><p id="syncline" style="font-size:13px;opacity:.7"></p></header>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="modal"></div>

<script>
/* ---------- data ---------- */
var KEY='chase-fly-shop-v1';
function defaults(){
  var mats=[
    ['M001','Hook','Nymph TMC 2487 #14',11.99,25],
    ['M002','Thread','Uni Red 6/0',5.00,200],
    ['M003','Bead','2.5mm or 3/32 Red Tungsten Bead',10.00,20],
    ['M004','Dubbing','Ice Dubbing (Olive)',5.00,200],
    ['M005','Wire','UTC Copper Brown Wire Ultra',2.10,200],
    ['M006','Hook','Nymph U102 #18',7.60,50],
    ['M007','Thread','VeeVus C02 12/0',5.10,200],
    ['M008','Bead','Silver 2.5mm or 3/32 Brass Bead',3.80,25],
    ['M009','Dubbing','Superfine Dark Tan (Hardline)',3.50,200],
    ['M010','Wire','UTC Silver Ultra Wire',4.20,200]
  ].map(function(m){return {id:m[0],cat:m[1],name:m[2],packCost:m[3],packQty:m[4],stock:m[4]}});
  return {
    rev:0, updatedAt:0, savingsPct:25, minMargin:50, nextId:3, shopName:'Fly shop',
    materials:mats,
    flies:[
      {id:'F1',name:'Blood Midge #16',price:2.50,recipe:[['M001',1],['M002',1],['M003',1],['M004',1],['M005',1]]},
      {id:'F2',name:'White Midge #18',price:1.50,recipe:[['M006',1],['M007',1],['M008',1],['M009',1],['M010',1]]}
    ],
    orders:[{id:'O1',shop:'Fly shop',fly:'F1',qty:12,status:'open',date:today(),paid:0}],
    ledger:[]
  };
}
var showPaid=false, S, tab='home', toast='', shelfCats=[], shelfQ='', flyCats=[], flyQ='', flyShow='all';
function today(){return new Date().toISOString().slice(0,10)}
function load(){try{var t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);return}}catch(e){}S=defaults()}
function save(){S.rev=(S.rev||0)+1;S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}schedulePush()}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(n){var v=Math.round(n*100)/100;return (v<0?'-':'')+'$'+Math.abs(v).toFixed(2)}
function mat(id){return S.materials.filter(function(m){return m.id===id})[0]}
function fly(id){return S.flies.filter(function(f){return f.id===id})[0]}
function unit(m){return m.packCost/m.packQty}
function canTie(f){return f.canTie!==false}
function minMargin(){return S.minMargin==null?50:S.minMargin}
function orderRecipe(o,f){return o.recipe||f.recipe}
function orderCost(o,f){return o.cost!=null?o.cost:flyCost(f)*o.qty}
function minPrice(f){return flyCost(f)/(1-minMargin()/100)}
function marginOf(price,cost){return price>0?(price-cost)/price*100:0}
function liveFlies(){return S.flies.filter(function(f){return !f.deleted})}
function tieable(keepId){return liveFlies().filter(function(f){return canTie(f)||f.id===keepId})}
function flyCost(f){return f.recipe.reduce(function(t,r){var m=mat(r[0]);return t+(m?unit(m)*r[1]:0)},0)}
function jar(b){return S.ledger.filter(function(e){return e.b===b}).reduce(function(t,e){return t+e.amt},0)}
function yours(){return jar('spend')+jar('save')}
function addLedger(b,amt,note){S.ledger.push({b:b,amt:Math.round(amt*100)/100,note:note,d:today()})}
function neededForOpen(){
  var need={};
  S.orders.filter(function(o){return o.status==='open'}).forEach(function(o){
    var f=fly(o.fly);if(!f)return;
    f.recipe.forEach(function(r){need[r[0]]=(need[r[0]]||0)+r[1]*o.qty});
  });
  return need;
}
function commit(msg){toast=msg||'';save();render()}

/* ---------- actions ---------- */
function tieOrder(id){
  var o=S.orders.filter(function(x){return x.id===id})[0],f=fly(o.fly),short=[];
  f.recipe.forEach(function(r){var m=mat(r[0]),use=r[1]*o.qty;if(m.stock<use)short.push(m.name);m.stock=Math.max(0,m.stock-use)});
  o.recipe=f.recipe.map(function(r){return [r[0],r[1]]});o.cost=flyCost(f)*o.qty;
  o.status='tied';
  commit(short.length?'Marked tied. You ran short on: '+short.join(', ')+'. Count your tying materials.':'Nice work! Supplies taken from your tying materials.');
}
function payOrder(id){
  var o=S.orders.filter(function(x){return x.id===id})[0],f=fly(o.fly);
  var amt=parseFloat(document.getElementById('amt').value);
  if(isNaN(amt)||amt<0){return}
  var cost=orderCost(o,f),profit=amt-cost;
  var sv=0;
  o.status='paid';o.paid=amt;o.credited={r:cost,y:profit};
  var note=o.qty+' '+f.name;
  addLedger('restock',cost,note);
  addLedger('spend',profit-sv,note);
  closeModal();
  commit('');
  celebrate(o,f,amt,cost,profit,sv);
}
function fixPayModal(id){
  var o=S.orders.filter(function(x){return x.id===id})[0];if(!o)return;
  confirmModal('Fix this payment?','This takes back the '+$(o.paid)+' payment. Restock and Your money go back to how they were. The order goes back to "Delivered, not paid" so you can enter the right amount.','Yes, take it back',"fixPay('"+id+"')");
}
function fixPay(id){
  var o=S.orders.filter(function(x){return x.id===id})[0];if(!o||o.status!=='paid')return;
  var f=fly(o.fly);
  var cr=o.credited||{r:f?orderCost(o,f):0,y:o.paid-(f?orderCost(o,f):0)};
  snapshotUndo('before fixing a payment');
  var note='Took back payment: '+o.qty+' '+(f?f.name:'flies');
  addLedger('restock',-cr.r,note);addLedger('spend',-cr.y,note);
  o.status='tied';o.paid=0;delete o.credited;
  closeModal();commit('Payment taken back. Tap Got paid to enter the right amount.');
}
function buyPack(id){
  closeModal();
  var m=mat(id);
  m.stock+=m.packQty;
  commit('Added a pack of '+m.name+' to your count.');
}
function orderPrice(o){if(o.price!=null)return o.price;var f=fly(o.fly);return f?f.price:0}
function floorPrice(f){return Math.ceil(minPrice(f)*20-0.0001)/20}
function dealWarnText(f,price){
  var c=flyCost(f);
  if(price<c-0.0001||marginOf(price,c)<minMargin()-0.0001)return 'Your lowest price is '+$(floorPrice(f))+' each.';
  return '';
}
function dealWarn(flyId,priceId,warnId){
  var w=document.getElementById(warnId),p=document.getElementById(priceId);
  if(!w||!p)return;
  var t=dealWarnText(fly(flyId),parseFloat(p.value));
  w.textContent=t;w.style.display=t?'block':'none';
}
function flyChanged(selId,priceId,warnId){
  var f=fly(document.getElementById(selId).value);
  if(f)document.getElementById(priceId).value=f.price.toFixed(2);
  dealWarn(f?f.id:'',priceId,warnId);
}
function saveOrder(id){
  var o=S.orders.filter(function(x){return x.id===id})[0];
  var shop=document.getElementById('e-shop').value.trim()||'Fly shop';
  var date=document.getElementById('e-date').value||o.date;
  var pr=parseFloat(document.getElementById('e-price').value);
  if(isNaN(pr)||pr<0)return;
  o.price=pr;
  if(o.status==='open'){
    var qty=parseInt(document.getElementById('e-qty').value,10);
    if(!(qty>0))return;
    o.qty=qty;o.fly=document.getElementById('e-fly').value;
  }
  o.shop=shop;o.date=date;closeModal();commit('Order saved.');
}
function deleteOrder(id){snapshotUndo('before deleting an order');S.orders=S.orders.filter(function(x){return x.id!==id});closeModal();commit('Order deleted.')}
function undoTied(id){
  var o=S.orders.filter(function(x){return x.id===id})[0],f=fly(o.fly);
  orderRecipe(o,f).forEach(function(r){var m=mat(r[0]);if(m)m.stock+=r[1]*o.qty});
  delete o.recipe;delete o.cost;
  o.status='open';closeModal();commit('Back to "To tie". Supplies put back in your tying materials.');
}
function addOrder(){
  var shop=document.getElementById('o-shop').value.trim()||'Fly shop';
  var qty=parseInt(document.getElementById('o-qty').value,10);
  var price=parseFloat(document.getElementById('o-price').value);
  if(!(qty>0)||!document.getElementById('o-fly').value||isNaN(price)||price<0)return;
  S.shopName=shop;
  S.orders.unshift({id:'O'+(S.nextId++),shop:shop,fly:document.getElementById('o-fly').value,qty:qty,price:price,status:'open',date:today(),paid:0});
  closeModal();commit('Order added.');
}
function setCount(id){
  var v=parseFloat(document.getElementById('cnt').value);
  if(isNaN(v)||v<0)return;
  mat(id).stock=v;closeModal();commit('Count saved.');
}
function delFlyModal(id){
  var f=fly(id);
  var active=S.orders.filter(function(o){return o.fly===id&&o.status!=='paid'}).length;
  if(active){
    openModal('<h3>Can\'t delete '+esc(f.name)+' yet</h3><div class="muted">'+active+' order'+(active>1?'s are':' is')+' still open for this fly. Finish or delete '+(active>1?'those orders':'that order')+' on the Orders tab first.</div><button class="wide" onclick="closeModal()">OK</button>');
    return;
  }
  openModal('<h3>Delete '+esc(f.name)+'?</h3><div class="muted">It will disappear from your flies and your menu. Past paid orders keep their history. Your materials are not affected.</div>'+
   '<button class="wide" onclick="deleteFly(\''+id+'\')">Yes, delete it</button><button class="alt wide" onclick="closeModal()">No, keep it</button>');
}
function deleteFly(id){
  var f=fly(id),name=f.name;
  snapshotUndo('before deleting '+name);
  var used=S.orders.some(function(o){return o.fly===id});
  if(used)f.deleted=true;else S.flies=S.flies.filter(function(x){return x.id!==id});
  closeModal();commit('Deleted '+name+'.');
}
function toggleCan(id){var f=fly(id);f.canTie=!canTie(f);commit(f.canTie?f.name+' is now on your menu.':f.name+' moved to still learning.')}
function menuText(){
  var can=liveFlies().filter(canTie),lrn=liveFlies().filter(function(f){return !canTie(f)});
  var t="Chase's Fly Shop\n\n";
  can.forEach(function(f){t+=f.name+': '+$(f.price)+' each, '+$(f.price*12)+' per dozen\n'});
  if(lrn.length)t+='\nComing soon: '+lrn.map(function(f){return f.name}).join(', ')+'\n';
  return t;
}
/* QR code encoder: byte mode, error correction M, versions 1-6 */
function qrMatrix(text){
  var bytes=[];
  var enc=unescape(encodeURIComponent(String(text)));
  for(var i=0;i<enc.length;i++)bytes.push(enc.charCodeAt(i));
  var T=[null,[26,10,[[1,16]]],[44,16,[[1,28]]],[70,26,[[1,44]]],[100,18,[[2,32]]],[134,24,[[2,43]]],[172,16,[[4,27]]]];
  var AP=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34]];
  var ver=0,dataCw=0;
  for(var v=1;v<=6;v++){var dc=0;T[v][2].forEach(function(b){dc+=b[0]*b[1]});if(bytes.length<=dc-2){ver=v;dataCw=dc;break}}
  if(!ver)return null;
  var size=17+4*ver;
  // data bits
  var bits=[];
  function put(val,len){for(var i=len-1;i>=0;i--)bits.push((val>>i)&1)}
  put(4,4);put(bytes.length,8);bytes.forEach(function(b){put(b,8)});
  var cap=dataCw*8;
  for(var t=0;t<4&&bits.length<cap;t++)bits.push(0);
  while(bits.length%8)bits.push(0);
  var pads=[0xEC,0x11],pi=0;
  while(bits.length<cap){put(pads[pi++%2],8)}
  var data=[];for(var i=0;i<bits.length;i+=8){var x=0;for(var j=0;j<8;j++)x=(x<<1)|bits[i+j];data.push(x)}
  // GF math
  var exp=[],log=[];var x=1;for(var i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&256)x^=0x11D}
  for(var i=255;i<512;i++)exp[i]=exp[i-255];
  function mul(a,b){return (a&&b)?exp[log[a]+log[b]]:0}
  var ecLen=T[ver][1];
  var gen=[1];
  for(var i=0;i<ecLen;i++){var ng=[];for(var j=0;j<=gen.length;j++)ng[j]=0;for(var j=0;j<gen.length;j++){ng[j]^=gen[j];ng[j+1]^=mul(gen[j],exp[i])}gen=ng}
  function rs(d){var r=[];for(var i=0;i<ecLen;i++)r[i]=0;for(var i=0;i<d.length;i++){var f=d[i]^r[0];r.shift();r.push(0);if(f)for(var j=0;j<ecLen;j++)r[j]^=mul(gen[j+1],f)}return r}
  var blocks=[],pos=0;
  T[ver][2].forEach(function(b){for(var k=0;k<b[0];k++){var d=data.slice(pos,pos+b[1]);pos+=b[1];blocks.push({d:d,e:rs(d)})}});
  var out=[],maxd=0;blocks.forEach(function(b){if(b.d.length>maxd)maxd=b.d.length});
  for(var i=0;i<maxd;i++)blocks.forEach(function(b){if(i<b.d.length)out.push(b.d[i])});
  for(var i=0;i<ecLen;i++)blocks.forEach(function(b){out.push(b.e[i])});

function qrSvg(text,px){
  var A=qrMatrix(text);if(!A)return '';
  var n=A.length,q=4,tot=n+q*2,d='';

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+tot+' '+tot+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="'+tot+'" height="'+tot+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

var CATS=['Hook','Thread','Bead','Cone','Dubbing','Wire','Flash','Hackle','Feather','Fur','Foam','Chenille','Eyes','Rubber','Lead','Glue','Tool','Other'];
function allCats(){var c=CATS.slice();S.materials.forEach(function(m){if(m.cat&&c.indexOf(m.cat)<0)c.push(m.cat)});return c}
function unitHint(cat){
  var c=(cat||'').toLowerCase();
  if(/hook|bead|cone|eye/.test(c))return 'Count each one. The pack size is how many are in the pack. Most flies use 1.';
  if(/thread/.test(c))return 'Count in yards. Look at the spool label for the pack size. A small fly uses about 1 yard.';
  if(/wire|tinsel|floss/.test(c))return 'Count in inches. The pack size is the yards on the spool times 36. A small fly uses about 3 to 5 inches.';
  if(/dub/.test(c))return 'Hard to measure. Guess how many flies one package makes and use that as the pack size. Then use 1 per fly. Count what is left now and then and fix the number.';
  if(/flash|krystal|mylar/.test(c))return 'Count strands. The pack size is how many strands you can really use. A small fly uses 2 to 4.';
  if(/foam/.test(c))return 'Count in square inches. The pack size is the size of the sheet. A small piece for one fly is about 1 square inch or less.';
  if(/chenille|yarn|rubber|lead/.test(c))return 'Count in inches. The pack size is the length in the pack. Measure how much one fly uses.';
  if(/glue|resin|cement|epoxy/.test(c))return 'Hard to measure. Guess how many flies one bottle does and use that as the pack size. Then use 1 per fly.';
  if(/tool/.test(c))return 'Tools are not used up. Add one only if you want to keep track of it, and leave it out of recipes.';
  if(/feather|hackle|marabou|cdc|fur|hair|fiber/.test(c))return 'Count feathers or pieces. The pack size is how many you can really use. Use 1 per fly, or 0.5 if one feather does two flies.';
  return 'Pick one way to count it, like each, inches, or flies per pack, and always use the same one.';
}
function unitSuggest(cat){
  var c=(cat||'').toLowerCase();
  if(/hook|bead|cone|eye/.test(c))return 'each';
  if(/thread/.test(c))return 'yards';
  if(/wire|tinsel|floss/.test(c))return 'inches';
  if(/dub/.test(c))return 'flies per pack';
  if(/flash|krystal|mylar/.test(c))return 'strands';
  if(/foam/.test(c))return 'square inches';
  if(/chenille|yarn|rubber|lead/.test(c))return 'inches';
  if(/glue|resin|cement|epoxy/.test(c))return 'flies per pack';
  if(/feather|hackle|marabou|cdc|fur|hair|fiber/.test(c))return 'feathers';
  return 'each';
}
function updUnitHint(){var c=document.getElementById('m-cat'),h=document.getElementById('m-hint'),u=document.getElementById('m-unit');if(h&&c)h.textContent=unitHint(c.value);if(u&&c&&!u.value)u.placeholder='Example: '+unitSuggest(c.value)}
function unitOf(m){return m&&m.unit?m.unit:''}
function parseSteps(t){return String(t||'').split('\n').map(function(x){return x.replace(/^\s*(?:step\s*)?\d+[.):-]?\s*/i,'').trim()}).filter(function(x){return x})}
function okLink(u){return /^https:\/\/[^\s"'<>]+$/i.test(u)}

   '<div><label for="m-cost">What did the pack cost?</label><input id="m-cost" type="number" inputmode="decimal" step="0.01" value="'+(m?m.packCost:'')+'"></div>'+

function readFlyDraft(){
  var q={};
  S.materials.forEach(function(m){var el=document.getElementById('rq-'+m.id);if(el)q[m.id]=el.value});
  var n=document.getElementById('f-name'),p=document.getElementById('f-price');
  var c=document.getElementById('f-can');
  var st=document.getElementById('f-steps'),lk=document.getElementById('f-link');
  return {name:n?n.value:'',price:p?p.value:'',can:c?c.value:'',qty:q,steps:st?st.value:'',link:lk?lk.value:''};
}
function addMaterialInline(fid){
  var name=document.getElementById('nm-name').value.trim();
  var cat=document.getElementById('nm-cat').value.trim()||'Other';
  var cost=parseFloat(document.getElementById('nm-cost').value);
  var qty=parseFloat(document.getElementById('nm-qty').value);
  var have=parseFloat(document.getElementById('nm-have').value);
  var er=document.getElementById('nm-err');
  if(!name||isNaN(cost)||cost<0||!(qty>0)){er.textContent='Add a name, what the pack cost, and how many are in a pack.';er.style.display='block';return}
  var draft=readFlyDraft();
  var id='X'+(S.nextId++);
  S.materials.push({id:id,cat:cat,name:name,packCost:cost,packQty:qty,stock:isNaN(have)?qty:have});
  draft.qty[id]='1';
  save();
  flyModal(fid,draft);
}
var pendPhoto=null;
function photoImg(f,cls){var u=f&&f.photo;return (u&&typeof u==='string'&&u.indexOf('data:image/')===0)?'<img class="'+(cls||'fphoto')+'" alt="Photo of '+esc(f.name)+'" src="'+u+'">':''}
function photoPrev(f){var u=pendPhoto!==null?pendPhoto:(f&&f.photo)||'';return (u&&u.indexOf('data:image/')===0)?'<img class="fphoto" alt="Fly photo" src="'+u+'"><button class="alt small" onclick="photoRemove()">Remove photo</button>':'<div class="muted">No photo yet.</div>'}
function photoShow(id){var el=document.getElementById('f-photo-prev');if(el)el.innerHTML=photoPrev(id?fly(id):null)}
function photoRemove(){pendPhoto='';var el=document.getElementById('f-photo-prev');if(el)el.innerHTML='<div class="muted">No photo yet.</div>'}
function photoFits(url,id){var f=id?fly(id):null,cur=JSON.stringify(S).length-(f&&f.photo?f.photo.length:0);return cur+url.length<=250000}
function photoPick(inp,id){
  var file=inp.files&&inp.files[0];if(!file)return;
  var er=document.getElementById('f-err');
  var fail=function(){if(er){er.textContent='That photo would not load. Try another one.';er.style.display='block'}};
  try{
    var rd=new FileReader();
    rd.onerror=fail;
    rd.onload=function(){
      var im=new Image();im.onerror=fail;
      im.onload=function(){
        try{
          var max=360,w=im.width,h=im.height,k=Math.min(1,max/Math.max(w,h));
          var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
          cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
          pendPhoto=cv.toDataURL('image/jpeg',0.62);
          if(!photoFits(pendPhoto,id)){pendPhoto=null;if(er){er.textContent='There is not enough room for another photo. Remove a photo from another fly first.';er.style.display='block'}photoShow(id);return}
          if(er)er.style.display='none';
          photoShow(id);
        }catch(e){fail()}
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }catch(e){fail()}
}

   '<div><label for="f-photo">Photo of the fly</label><input id="f-photo" type="file" accept="image/*" onchange="photoPick(this,'+fid+')"><div id="f-photo-prev" class="stack" style="margin-top:8px">'+photoPrev(f)+'</div></div>'+
   '<div><label for="f-steps">How to tie it (one step on each line)</label><textarea id="f-steps" rows="7" style="font:inherit;min-height:150px" placeholder="Example:&#10;Put the hook in the vise.&#10;Start the thread behind the bead.">'+esc(stepsV)+'</textarea></div>'+
   '<div><label for="f-link">Link to a video or page (optional)</label><input id="f-link" type="url" inputmode="url" placeholder="https://" value="'+esc(linkV)+'"></div>'+
   (f?'<div class="muted">If you change this recipe, orders that are already tied or paid keep the recipe and cost they were tied with. Orders still waiting to be tied will use the new recipe.</div>':'')+
   '<div><b>Materials in this fly ('+recIds.length+')</b><div class="muted">This is what goes into ONE fly. Type how many of each. Swipe a material left to remove it, or tap the x.</div></div>'+
   (recIds.length?recIds.map(function(mid){var m=mat(mid);return '<div class="swipe" data-id="'+m.id+'"><div class="recipe-line frow"><label class="nm" for="rq-'+m.id+'" style="margin:0;font-weight:700">'+esc(m.name)+'<br><span class="muted">'+esc(m.cat)+(m.unit?' &middot; '+esc(m.unit):'')+'</span></label><input id="rq-'+m.id+'" type="number" inputmode="decimal" step="any" placeholder="0" value="'+esc(qtyOf[m.id])+'"><button class="alt small" aria-label="Remove '+esc(m.name)+'" onclick="removeFromRecipe(\''+m.id+'\','+fid+')">&times;</button></div></div>'}).join(''):'<div class="card muted">No materials yet. Add some from your shelf below.</div>')+
   '<div><b>Add materials from your shelf</b><div class="muted" id="f-count"></div></div>'+
   '<input id="fq" type="search" aria-label="Find a material" placeholder="Find a material" value="'+esc(flyQ)+'" oninput="flyQ=this.value;applyFlyFilter()">'+
   '<div class="chips" id="fchips" role="group" aria-label="Filter by type"></div>'+
   S.materials.filter(function(m){return recIds.indexOf(m.id)<0}).map(function(m){return '<div class="recipe-line arow" data-cat="'+esc(m.cat)+'" data-name="'+esc((m.name+' '+m.cat).toLowerCase())+'" data-id="'+m.id+'"><div class="nm"><b>'+esc(m.name)+'</b><br><span class="muted">'+esc(m.cat)+'</span></div><button class="small" onclick="addToRecipe(\''+m.id+'\','+fid+')">Add</button></div>'}).join('')+
   '<button class="alt wide" id="nm-open" onclick="document.getElementById(\'nm-box\').style.display=\'flex\';this.style.display=\'none\'">+ New material</button>'+
   '<div class="card stack" id="nm-box" style="display:none"><b>Add a new material</b>'+
    '<div><label for="nm-name">Name</label><input id="nm-name" placeholder="Example: Pheasant tail fibers"></div>'+
    '<div><label for="nm-cat">Type</label><input id="nm-cat" list="nm-cats" placeholder="Hook, bead, thread..."><datalist id="nm-cats">'+cats.map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div>'+
    '<div><label for="nm-cost">What did the pack cost?</label><input id="nm-cost" type="number" inputmode="decimal" step="0.01"></div>'+
    '<div><label for="nm-qty">How many are in the pack?</label><input id="nm-qty" type="number" inputmode="decimal" step="any"></div>'+
    '<div><label for="nm-have">How many do you have now?</label><input id="nm-have" type="number" inputmode="decimal" step="any" placeholder="Leave blank for a full pack"></div>'+
    '<div class="alert" id="nm-err" style="display:none"></div>'+
    '<button onclick="addMaterialInline('+fid+')">Add it to this fly</button></div>'+

  var er=document.getElementById('f-err');

    w.addEventListener('touchmove',function(e){if(x0===null)return;var t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;if(dx===0&&Math.abs(mx)<Math.abs(my)+6)return;dx=Math.min(0,mx);row.style.transform='translateX('+dx+'px)'},{passive:true});
    w.addEventListener('touchend',function(){if(x0===null)return;x0=null;row.style.transition='transform .15s';if(dx<-90){row.style.transform='translateX(-110%)';removeFromRecipe(mid,id)}else{row.style.transform=''}},{passive:true});
  });
}
function flyTop(){var el=document.querySelector?document.querySelector('.sheet'):null;return el?el.scrollTop:0}
function flyReopen(id,draft,top){flyModal(id,draft);var el=document.querySelector?document.querySelector('.sheet'):null;if(el&&top)el.scrollTop=top}
function removeFromRecipe(mid,id){var d=readFlyDraft(),t=flyTop();delete d.qty[mid];flyReopen(id,d,t)}
function addToRecipe(mid,id){var d=readFlyDraft(),t=flyTop();if(d.qty[mid]===undefined)d.qty[mid]='1';flyReopen(id,d,t)}
function toggleCat(list,c){var i=list.indexOf(c);if(i>=0)list.splice(i,1);else list.push(c)}
function applyFlyFilter(){
  var cats=['All'].concat(allCats());
  flyCats=flyCats.filter(function(c){return cats.indexOf(c)>=0});
  var ch=document.getElementById('fchips');
  if(ch){
    ch.innerHTML=cats.map(function(c,i){return '<button class="chip" data-i="'+i+'" aria-pressed="'+(i===0?flyCats.length===0:flyCats.indexOf(c)>=0)+'">'+esc(c)+'</button>'}).join('');
    ch.querySelectorAll('button').forEach(function(b){b.onclick=function(){var i=parseInt(b.getAttribute('data-i'),10);if(i===0)flyCats=[];else toggleCat(flyCats,cats[i]);applyFlyFilter()}});
  }
  var q=flyQ.trim().toLowerCase(),n=0,rows=document.querySelectorAll('.arow');
  rows.forEach(function(r){
    var ok=(!flyCats.length||flyCats.indexOf(r.getAttribute('data-cat'))>=0)&&(!q||r.getAttribute('data-name').indexOf(q)>=0);
    r.style.display=ok?'':'none';if(ok)n++;
  });
  var c=document.getElementById('f-count');if(c)c.textContent=rows.length?('Showing '+n+' of '+rows.length+' materials not in this fly'):'Every material on your shelf is already in this fly.';
}

function payWarn(id){
  var o=S.orders.filter(function(x){return x.id===id})[0],f=fly(o.fly);
  var amt=parseFloat(document.getElementById('amt').value),w=document.getElementById('pay-warn');
  if(!w)return;
  var cost=orderCost(o,f);
  if(!isNaN(amt)&&amt>=0&&marginOf(amt,cost)<minMargin()-0.0001){
    w.textContent='Your lowest price is '+$(floorPrice(f))+' each.';
    w.style.display='block';
  }else{w.textContent='';w.style.display='none'}
}

function refreshApp(){
  var done=function(){location.reload()};
  var p=Promise.resolve();
  if('serviceWorker' in navigator)p=p.then(function(){return navigator.serviceWorker.getRegistrations()}).then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))});
  if(window.caches)p=p.then(function(){return caches.keys()}).then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))});
  p.then(done,done);
}

function buyList(){

    var n=need[m.id]||0,short=n>m.stock,low=m.stock<=m.packQty*0.2;

  });

}

ning low.</div></details><details><summary>Tying Materials</summary><div class="muted" style="margin-top:8px">This tab shows what you have. Tap <b>Count it</b> when you look in the bin and the number is different. Tap <b>Bought a pack</b> when a new pack arrives. To add something new, tap <b>+ New material</b>. Count hooks and beads one by one. Count thread in yards and wire in inches. For dubbing, guess how many flies one package makes.</div></details><details><summary>Add a new fly</summary><div class="muted" style="margin-top:8px">Open the Office, then Flies, and tap <b>+ New fly</b>. Type the name and price, and add a photo if you want. Then add the materials from your shelf and type how many go into one fly. Swipe a material to the left (or tap the x) to take it out. You can type the steps for tying it, and a link to a video. If you can not tie it yet, choose <b>Still learning</b>. It stays off the menu until you can.</div></details><details><summary>Show a shop the menu</summary><div class="muted" style="margin-top:8px">Tap <b>Show a shop my menu</b> on the Shop tab. It shows the flies you can tie, with photos and prices. On the Flies tab, tap <b>See recipe</b> to see the materials and the tying steps. Tap each step when you finish it.</div></details><details><summary>Fly wishlist</summary><div class=\"muted\" style=\"margin-top:8px\">Want to learn a new fly? On the Flies tab tap <b>Fly wishlist</b>, then <b>+ Add a fly idea</b>. You can add notes and a link to a video. When you are ready, tap <b>Make it a recipe</b> and it opens the new fly screen with the name filled in. It leaves the wishlist when you save the recipe.</div></details><details><summary>Oops!</summary><div class="muted" style="margin-top:8px">If you make a mistake, most things can be fixed. Open the Office, then Settings, to undo the last big change. Before you try something risky, make a backup there. If the app looks old, tap <b>Refresh the app</b>.</div></details></div><button class="alt wide" onclick="closeModal()">Close</button>');

    var label={open:'To tie',tied:'Delivered, not paid',paid:'Paid'}[o.status];
    h+='<div class="card stack"><div class="row"><b>'+o.qty+' &times; '+esc(f.name)+'</b><span class="pill '+o.status+'">'+label+'</span></div>'+
       '<div class="muted">'+esc(o.shop)+' &middot; '+esc(o.date)+'</div>';
    if(o.status==='paid'){h+='<div class="row"><span class="muted">Paid</span><b>'+$(o.paid)+'</b></div>'}
    else{h+='<div class="row"><span class="muted">Price each</span><b>'+$(orderPrice(o))+'</b></div><div class="row"><span class="muted">Should earn</span><b>'+$(est)+'</b></div>'+(dw?'<div class="alert">'+esc(dw)+'</div>':'')}

    h+='</div>';
  });
  if(paidN)h+='<button class="alt wide" onclick="showPaid=!showPaid;render()">'+(showPaid?'Hide paid orders':'Show paid orders ('+paidN+')')+'</button>';
  return h;
}

/* ---------- sync (Firebase Realtime Database over plain REST) ---------- */
var SYNC_KEY='chase-fly-shop-sync-v1', sync=null, busy=false, pushTimer=null, pollStarted=false;
function loadSync(){try{var t=localStorage.getItem(SYNC_KEY);sync=t?JSON.parse(t):null}catch(e){sync=null}}
function storeSync(){try{if(sync)localStorage.setItem(SYNC_KEY,JSON.stringify(sync));else localStorage.removeItem(SYNC_KEY)}catch(e){}}
function syncEndpoint(){return sync.url.replace(/\/+$/,'')+'/shops/'+encodeURIComponent(sync.code)+'.json'}
function tfetch(url,opts){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},8000);
  opts=opts||{};opts.signal=c.signal;
  return fetch(url,opts).then(function(r){clearTimeout(t);return r},function(e){clearTimeout(t);throw e});
}
function newer(a,b){var ar=a.rev||0,br=b.rev||0;if(ar!==br)return ar>br;return (a.updatedAt||0)>(b.updatedAt||0)}
function timeStr(){return new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
var lastMsg='Connected';
function setSyncMsg(m){if(m)lastMsg=m;var el=document.getElementById('syncline');if(el)el.textContent=sync?m:'';var el2=document.getElementById('syncstatus');if(el2)el2.textContent=m}
function pushNow(){
  if(!sync)return Promise.resolve();
  var body=JSON.stringify({rev:S.rev||0,updatedAt:S.updatedAt||0,data:JSON.stringify(S)});
  return tfetch(syncEndpoint(),{method:'PUT',headers:{'Content-Type':'application/json'},body:body}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);setSyncMsg('Synced '+timeStr());
  }).catch(function(){setSyncMsg('Offline. Will sync when connected.')});
}
function schedulePush(){if(!sync)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,800)}
function pull(){
  if(!sync||busy)return Promise.resolve();
  busy=true;
  return tfetch(syncEndpoint()).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(remote){
    if(!remote||!remote.data)return pushNow();
    var rs=JSON.parse(remote.data);
    if(newer(rs,S)){S=rs;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();setSyncMsg('Synced '+timeStr())}
    else if(newer(S,rs)){return pushNow()}
    else setSyncMsg('Synced '+timeStr());
  }).catch(function(){setSyncMsg('Offline. Will sync when connected.')}).then(function(){busy=false});
}
function startSync(){
  if(!sync||pollStarted)return;pollStarted=true;
  setInterval(function(){if(!document.hidden)pull()},10000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
  window.addEventListener('online',pull);
}
function parseSetupLink(t){
  var i=t.indexOf('#sync=');if(i<0)return null;
  try{var o=JSON.parse(atob(decodeURIComponent(t.slice(i+6).trim())));if(o.u&&o.c)return {url:o.u,code:o.c}}catch(e){}
  return null;
}
function setupLink(){return location.origin+location.pathname+'#sync='+encodeURIComponent(btoa(JSON.stringify({u:sync.url,c:sync.code})))}
function genCode(){
  var a=new Uint8Array(16);crypto.getRandomValues(a);
  var out='';a.forEach(function(b){out+=b.toString(36).slice(-2)});return out;
}
function connectSync(){
  var link=document.getElementById('sy-link').value.trim();
  var url,code,er=document.getElementById('sy-err');
  var p=link?parseSetupLink(link):null;
  if(link&&!p){er.textContent='That setup link did not look right. Copy the whole link.';er.style.display='block';return}
  if(p){url=p.url;code=p.code}
  else{url=document.getElementById('sy-url').value.trim();code=document.getElementById('sy-code').value.trim()}
  if(!/^https:\/\/[^\s]+$/.test(url)||code.length<12){er.textContent='Enter the database address (starts with https://) and a shop code with at least 12 characters.';er.style.display='block';return}
  sync={url:url,code:code};storeSync();startSync();
  setSyncMsg('Connecting...');
  pull().then(function(){render()});
  render();
}
function disconnectSync(){closeModal();sync=null;storeSync();setSyncMsg('');render()}
function copySetupLink(){var t=document.getElementById('sy-share');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}}
function syncCard(){
  if(sync){
    return '<div class="card stack"><h2 style="margin:0">Sync with Dad</h2><div class="okmsg" id="syncstatus">'+esc(lastMsg)+'</div>'+
     '<div class="muted">Anyone with the setup link below can see and change this shop. Only share it with Dad.</div>'+
     '<div><label for="sy-share">Setup link for another device</label><textarea id="sy-share" readonly onclick="this.select()">'+esc(setupLink())+'</textarea></div>'+
     '<button class="alt wide" onclick="copySetupLink()">Copy setup link</button>'+
     '<button class="alt wide" onclick="disconnectModal()">Turn off sync on this device</button></div>';
  }
  return '<div class="card stack"><h2 style="margin:0">Sync with Dad</h2>'+
    '<div class="muted">Connect so Dad can see the shop on his phone or computer. Both devices show the same orders, tying materials, and jars.</div>'+
    '<div><label for="sy-link">Paste a setup link</label><textarea id="sy-link" placeholder="Paste the link Dad sent you"></textarea></div>'+
    '<div class="muted">Or enter the details by hand:</div>'+
    '<div><label for="sy-url">Database address</label><input id="sy-url" value="https://fly-shop-6d486-default-rtdb.firebaseio.com" placeholder="https://your-project-default-rtdb.firebaseio.com"></div>'+
    '<div><label for="sy-code">Shop code</label><input id="sy-code" placeholder="At least 12 letters and numbers"></div>'+
    '<button class="alt wide" onclick="document.getElementById(\'sy-code\').value=genCode()">Make a new shop code</button>'+
    '<div class="alert" id="sy-err" style="display:none"></div>'+
    '<button class="wide" onclick="connectSync()">Connect</button></div>';
}

(function(){
  if(location.hash.indexOf('#sync=')===0){var p=parseSetupLink(location.hash);if(p){sync=p;storeSync()}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
})();
if(!sync)loadSync();
load();render();
if(sync){setSyncMsg('Connecting...');startSync();pull()}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  var hadController=!!navigator.serviceWorker.controller,reloadedForSW=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadController&&!reloadedForSW){reloadedForSW=true;location.reload()}});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(r){try{r.update()}catch(e){}document.addEventListener('visibilitychange',function(){if(!document.hidden){try{r.update()}catch(e){}}})}).catch(function(){})});
}
